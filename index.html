<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Index - 文件索引</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1d1d1f;
            --secondary: #86868b;
            --accent: #0066cc;
            --border: #f0f0f2;
            --row-hover: #f5f5f7;
            --success: #34c759;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --text: #f5f5f7;
                --secondary: #86868b;
                --accent: #2997ff;
                --border: #1c1c1e;
                --row-hover: #1c1c1e;
            }
        }

        /* 基础样式 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }
        #app {
            width: 100%;
            max-width: 700px;
        }

        /* 进场动画定义 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            margin-bottom: 50px;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 12px 0;
        }
        .repo-path {
            color: var(--secondary);
            font-size: 16px;
            font-weight: 400;
        }

        /* 列表样式 */
        .file-list {
            position: relative;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 20px;
            margin: 0 -20px;
            border-bottom: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
            cursor: default;
        }
        .file-item:hover {
            background-color: var(--row-hover);
            transform: scale(1.02) translateX(10px);
            border-bottom-color: transparent;
        }

        .file-icon {
            margin-right: 20px;
            font-size: 28px;
            transition: transform 0.3s ease;
        }
        .file-item:hover .file-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .file-info {
            flex-grow: 1;
        }
        .file-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }
        .file-item:hover .file-name {
            color: var(--accent);
        }

        /* 动作按钮 */
        .file-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .file-item:hover .file-actions {
            opacity: 1;
        }

        a, button {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--row-hover);
            transition: all 0.2s ease;
        }
        a:hover, button:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
        }

        /* 复制成功的动画效果 */
        .fade-enter-active, .fade-leave-active {
            transition: all 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }
        .copy-status {
            position: absolute;
            right: 0;
            color: var(--success);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>Resources</h1>
            <div class="repo-path">数据资产访问门户</div>
        </header>

        <div class="file-list">
            <div v-for="(file, index) in files" 
                 :key="file.name" 
                 class="file-item"
                 :style="{ animationDelay: (index * 0.1) + 's' }">
                
                <div class="file-icon">{{ getIcon(file.name) }}</div>
                
                <div class="file-info">
                    <div class="file-name">{{ file.name }}</div>
                    <div class="file-actions">
                        <a :href="file.path" target="_blank">打开</a>
                        <button @click="copyLink(file.path, file.name)">复制链接</button>
                    </div>
                </div>

                <transition name="fade">
                    <div v-if="copied === file.name" class="copy-status">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        已复制
                    </div>
                </transition>
            </div>
        </div>

        <footer>
            <p>© 2026 <a href="https://github.com/licyk/" target="_blank" class="footer-link">licyk</a></p>
        </footer>
    </div>

    <style>
        /* 在现有的 style 标签内增加 footer 样式 */
        footer {
            margin-top: 100px;
            padding: 40px 0;
            text-align: center;
            color: var(--secondary);
            font-size: 13px;
            border-top: 1px solid var(--border);
            animation: fadeIn 1.2s ease backwards;
            animation-delay: 0.8s;
            line-height: 1.8;
        }
        footer p {
            margin: 0;
            opacity: 0.8;
        }
        .footer-link {
            color: inherit;
            text-decoration: none;
            padding: 0 !important;
            background: none !important;
            border-radius: 0 !important;
            transition: color 0.3s ease;
            font-weight: 600;
        }
        .footer-link:hover {
            color: var(--accent) !important;
            text-decoration: underline !important;
            background: none !important;
            box-shadow: none !important;
        }
    </style>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const files = ref([
                    { name: 'lora_list.json', path: './lora_list.json' },
                    { name: 'portable_list.json', path: './portable_list.json' },
                ]);

                const copied = ref('');

                const getIcon = (name) => {
                    if (name.endsWith('.json')) return '📄';
                    if (name.endsWith('.yml')) return '⚙️';
                    return '📁';
                };

                const copyLink = (path, name) => {
                    const fullUrl = new URL(path, window.location.href).href;
                    navigator.clipboard.writeText(fullUrl).then(() => {
                        copied.value = name;
                        setTimeout(() => copied.value = '', 2000);
                    });
                };

                return {
                    files,
                    copied,
                    getIcon,
                    copyLink
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
